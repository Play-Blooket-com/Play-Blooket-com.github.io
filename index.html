<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play Blooket | Blooket</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
header{height:32px;background:#8e2db2;color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:20px;position:relative;z-index:5}
header .join{position:absolute;left:50%;transform:translateX(-50%);font-size:20px}header .login{margin-left:auto;font-size:16px;text-decoration:underline}
main{position:relative;width:100%;height:calc(100vh - 32px);overflow:hidden;background-color:#d8b31c;background-image:radial-gradient(ellipse at center,rgba(255,238,80,.1),transparent 65%),repeating-linear-gradient(16deg,transparent 0 34px,rgba(255,240,80,.09) 35px 39px,transparent 40px 72px),repeating-linear-gradient(106deg,transparent 0 34px,rgba(255,240,80,.08) 35px 39px,transparent 40px 72px);background-size:100% 100%,74px 74px,74px 74px}
main:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 50% 50%,transparent 0 22px,rgba(255,232,55,.07) 23px 41px,transparent 42px);background-size:100px 100px}
8%{opacity:1}50%{transform:translate(var(--drift,50px),55vh) rotate(180deg)}100%{transform:translate(calc(var(--drift,50px)*-.4),120vh) rotate(360deg);opacity:0}}
.center{position:absolute;z-index:3;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center}
h1{margin:0 0 14px;color:white;font-size:52px;font-weight:1000;letter-spacing:-2px;text-shadow:0 1px 1px #c7a31c}
form{display:flex;gap:6px;justify-content:center}.pin{height:42px;width:136px;border:0;border-radius:5px;background:#fff;font-size:20px;text-align:center;color:#555;outline:none}.pin::placeholder{color:#777}.go{height:42px;width:42px;border:0;border-radius:5px;background:#fff;color:#555;font-size:25px;font-weight:bold;cursor:pointer}
</style></head><body><header><span>Blooket</span><span class="join">Join a Game</span><span class="login">Log In</span></header><main>

<section class="center"><h1>Blooket</h1><form id="join"><input class="pin" id="pin" placeholder="Game ID" inputmode="numeric" aria-label="Game ID"><button class="go" type="submit">➜</button></form></section></main>
<script>document.getElementById('join').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('pin').value.trim()==='5234'){let w=window.open('about:blank','_blank');if(w){w.document.title='';w.document.body.innerHTML='';}}});</script></body></html>
