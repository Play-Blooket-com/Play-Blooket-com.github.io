<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blooket</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}.nav{height:31px;background:#8c00b5;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:900}.nav .mid{position:absolute;left:50%;transform:translateX(-50%);font-size:15px}.nav .login{font-size:12px}.scene{height:calc(100vh - 31px);position:relative;overflow:hidden;background-color:#d9bc00;background-image:repeating-linear-gradient(15deg,transparent 0 37px,rgba(255,235,70,.13) 38px 41px,transparent 42px 75px),repeating-linear-gradient(105deg,transparent 0 37px,rgba(255,235,70,.13) 38px 41px,transparent 42px 75px),radial-gradient(circle at 50% 50%,transparent 0 24px,rgba(255,230,30,.1) 25px 42px,transparent 43px);background-size:75px 75px,75px 75px,100px 100px}.leaf{position:absolute;width:var(--w);left:var(--x);top:-15vh;pointer-events:none;animation:fall var(--dur) linear var(--delay) infinite;z-index:1}@keyframes fall{0%{transform:translate(0,-10vh) rotate(0deg);opacity:0}10%{opacity:1}50%{transform:translate(var(--drift),55vh) rotate(180deg)}100%{transform:translate(calc(var(--drift)*-0.6),115vh) rotate(360deg);opacity:0}}.leaf:nth-of-type(2n){--dur:17s;--delay:-6s;--drift:65px}.leaf:nth-of-type(3n){--dur:22s;--delay:-12s;--drift:-45px}.leaf:nth-of-type(4n){--dur:14s;--delay:-3s;--drift:30px}.center{position:absolute;left:50%;top:38%;transform:translate(-50%,-5%);text-align:center;z-index:2}.title{font-size:40px;font-weight:1000;color:white;margin:0 0 12px;text-shadow:0 1px 1px rgba(0,0,0,.08)}form{display:flex;gap:5px}.pin{width:136px;height:38px;border:0;border-radius:4px;text-align:center;font-size:17px;font-weight:bold;background:white;outline:none}.arrow{height:38px;width:38px;border:0;border-radius:4px;background:#fff;color:#555;font-size:24px;font-weight:bold;cursor:pointer}.arrow:active{transform:translateY(1px)}@media(max-width:600px){.title{font-size:34px}}
</style></head><body><header class="nav"><span>Blooket</span><span class="mid">Join a Game</span><span class="login">Log In</span></header><main class="scene">
<img class="leaf" style="--x:21%;--w:28px;--dur:13s;--delay:-2s;--drift:25px" src="assets/fall_orange_leaf.svg"><img class="leaf" style="--x:39%;--w:60px;--dur:19s;--delay:-9s;--drift:-65px" src="assets/fall_red_leaf.svg"><img class="leaf" style="--x:80%;--w:58px;--dur:16s;--delay:-5s;--drift:40px" src="assets/fall_yellow_leaf.svg"><img class="leaf" style="--x:9%;--w:24px;--dur:15s;--delay:-7s;--drift:35px" src="assets/fall_yellow_leaf.svg"><img class="leaf" style="--x:27%;--w:56px;--dur:20s;--delay:-12s;--drift:-50px" src="assets/fall_orange_leaf.svg"><img class="leaf" style="--x:46%;--w:36px;--dur:12s;--delay:-3s;--drift:20px" src="assets/fall_orange_leaf.svg"><img class="leaf" style="--x:68%;--w:60px;--dur:18s;--delay:-10s;--drift:-55px" src="assets/fall_red_leaf.svg"><img class="leaf" style="--x:87%;--w:49px;--dur:16s;--delay:-6s;--drift:50px" src="assets/fall_yellow_leaf.svg"><img class="leaf" style="--x:92%;--w:49px;--dur:22s;--delay:-13s;--drift:-40px" src="assets/fall_red_leaf.svg"><img class="leaf" style="--x:34%;--w:58px;--dur:19s;--delay:-9s;--drift:40px" src="assets/fall_yellow_leaf.svg"><img class="leaf" style="--x:44%;--w:60px;--dur:14s;--delay:-4s;--drift:-25px" src="assets/fall_orange_leaf.svg"><img class="leaf" style="--x:1%;--w:25px;--dur:17s;--delay:-8s;--drift:60px" src="assets/fall_red_leaf.svg"><img class="leaf" style="--x:62%;--w:38px;--dur:15s;--delay:-6s;--drift:-30px" src="assets/fall_red_leaf.svg"><img class="leaf" style="--x:82%;--w:53px;--dur:20s;--delay:-12s;--drift:30px" src="assets/fall_orange_leaf.svg"><img class="leaf" style="--x:23%;--w:63px;--dur:18s;--delay:-7s;--drift:-45px" src="assets/fall_red_leaf.svg"><img class="leaf" style="--x:66%;--w:65px;--dur:21s;--delay:-11s;--drift:45px" src="assets/fall_yellow_leaf.svg">
<section class="center"><h1 class="title">Blooket</h1><form id="join"><input id="pin" class="pin" placeholder="Game ID" aria-label="Game ID" inputmode="numeric"><button class="arrow" aria-label="Enter" type="submit">➜</button></form></section></main><script>document.getElementById('join').addEventListener('submit',e=>{e.preventDefault();if(document.getElementById('pin').value.trim()==='5234'){const w=window.open('about:blank','_blank');if(w){w.document.title='';w.document.body.innerHTML='';}}});</script></body></html>
