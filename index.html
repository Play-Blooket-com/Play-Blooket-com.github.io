<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play Blooket | Blooket</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
header{height:32px;background:#8e2db2;color:#fff;display:flex;align-items:center;padding:0 12px;font-weight:800;font-size:20px;position:relative;z-index:5}
header .join{position:absolute;left:50%;transform:translateX(-50%);font-size:20px}header .login{margin-left:auto;font-size:16px;text-decoration:underline}
main{position:relative;width:100%;height:calc(100vh - 32px);overflow:hidden;background:#292929 url("assets/background") center center / cover no-repeat}
main:before,main:after{display:none}
.ghost{position:absolute;left:var(--x);top:-120px;width:var(--w);height:var(--h);z-index:1;opacity:var(--o);animation:ghost-fall var(--dur) linear var(--delay) infinite;filter:blur(.15px)}
.ghost-body{position:relative;width:100%;height:100%;background:rgba(245,245,245,.34);border-radius:45% 45% 18% 18%;clip-path:polygon(0 0,100% 0,100% 82%,85% 100%,68% 84%,50% 100%,32% 84%,15% 100%,0 82%);backdrop-filter:blur(1px)}
.ghost-body:before{content:"";position:absolute;top:35%;left:30%;width:9%;height:9%;border-radius:50%;background:rgba(30,30,30,.55);box-shadow:calc(var(--w)*.30) 0 0 rgba(30,30,30,.55)}
@keyframes ghost-fall{0%{transform:translate3d(0,-15vh,0) rotate(var(--rot));}100%{transform:translate3d(var(--drift),115vh,0) rotate(calc(var(--rot) + 360deg));}}
.center{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:410px;max-width:90vw}
h1{margin:0 0 22px;color:white;font-size:76px;font-weight:1000;letter-spacing:-3px;text-shadow:0 1px 1px #c7a31c}
form{display:flex;gap:6px;justify-content:center}.pin{height:56px;width:200px;border:0;border-radius:5px;background:#fff;font-size:24px;text-align:center;color:#555;outline:none;box-shadow:0 5px 0 rgba(0,0,0,.12)}.pin::placeholder{color:#777}.go{height:56px;width:60px;border:0;border-radius:5px;background:#fff;color:#555;font-size:32px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
</style></head><body><header><span>Blooket</span><span class="join">Join a Game</span><span class="login">Log In</span></header><main>
<div class="ghost" style="--x:4%;--w:120px;--h:140px;--o:.8;--dur:13s;--delay:-2s;--rot:18deg;--drift:70px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:22%;--w:90px;--h:110px;--o:.55;--dur:17s;--delay:-8s;--rot:-12deg;--drift:-55px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:39%;--w:145px;--h:170px;--o:.45;--dur:19s;--delay:-12s;--rot:24deg;--drift:95px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:61%;--w:105px;--h:125px;--o:.6;--dur:15s;--delay:-5s;--rot:-20deg;--drift:-80px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:78%;--w:135px;--h:155px;--o:.7;--dur:18s;--delay:-11s;--rot:10deg;--drift:60px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:93%;--w:85px;--h:100px;--o:.5;--dur:12s;--delay:-7s;--rot:-30deg;--drift:-40px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:12%;--w:70px;--h:85px;--o:.4;--dur:21s;--delay:-15s;--rot:15deg;--drift:50px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:50%;--w:80px;--h:95px;--o:.35;--dur:16s;--delay:-3s;--rot:-8deg;--drift:-70px"><div class="ghost-body"></div></div>
<div class="ghost" style="--x:70%;--w:95px;--h:115px;--o:.45;--dur:20s;--delay:-17s;--rot:25deg;--drift:80px"><div class="ghost-body"></div></div>

<section class="center"><h1>Blooket</h1><form id="join"><input class="pin" id="pin" placeholder="Game ID" inputmode="numeric" aria-label="Game ID"><button class="go" type="submit">➜</button></form></section></main>
<script>document.getElementById('join').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('pin').value.trim()==='5234'){let w=window.open('about:blank','_blank');if(w){w.document.title='';w.document.body.innerHTML='';}}});</script></body></html>
