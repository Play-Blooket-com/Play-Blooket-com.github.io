<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e09f3e">
  <title>Play Blooket | Join a Game</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Nunito,"Trebuchet MS",Arial,sans-serif;color:#303030}
    body{min-height:100vh;background:#e09f3e;overflow:hidden}
    .checks{position:fixed;inset:0;opacity:.14;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff 75%),linear-gradient(-45deg,transparent 75%,#fff 75%);background-size:44px 44px;background-position:0 0,0 22px,22px -22px,-22px 0;pointer-events:none}
    header{height:64px;position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff}
    .brand{font-size:25px;font-weight:1000;color:#fff;text-decoration:none;text-shadow:0 2px 0 #9b5d20}
    .header-title{font-size:20px;font-weight:900;text-shadow:0 2px 0 #9b5d20}
    .login{color:#fff;font-weight:800;text-decoration:none}
    main{position:relative;z-index:1;min-height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;padding:24px}
    .panel{width:min(570px,100%);padding:42px 38px 38px;text-align:center;background:#fff;border:5px solid #f3d7a6;border-radius:24px;box-shadow:0 9px 0 #9c6429,0 18px 35px #693d1b44}
    h1{font-size:clamp(42px,9vw,68px);line-height:1;margin:0 0 34px;color:#e09f3e;font-weight:1000;letter-spacing:-2px;text-shadow:0 3px 0 #f5d6a0}
    .row{display:flex;gap:10px}
    input{min-width:0;flex:1;height:64px;border:3px solid #ddd;border-radius:13px;padding:0 18px;font-size:22px;font-weight:800;text-align:center;outline:none}
    input:focus{border-color:#e09f3e;box-shadow:0 0 0 3px #e09f3e33}
    button{width:68px;height:64px;border:0;border-radius:13px;background:#9a49aa;color:#fff;font-size:34px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #693177}
    button:active{transform:translateY(3px);box-shadow:0 2px 0 #693177}
    .hint{margin:20px 0 0;color:#777;font-size:14px}
    .notice{min-height:20px;margin-top:14px;color:#a33;font-weight:700}
    @media(max-width:480px){header{padding:0 16px}.header-title{font-size:16px}.panel{padding:34px 20px}.row{gap:7px}input{font-size:19px}button{width:58px}}
  </style>
</head>
<body>
  <div class="checks" aria-hidden="true"></div>
  <header>
    <a class="brand" href="https://www.blooket.com/">Blooket</a>
    <div class="header-title">Join a Game</div>
    <a class="login" href="https://id.blooket.com/login">Log In</a>
  </header>
  <main>
    <section class="panel" aria-label="Join a game">
      <h1>Blooket</h1>
      <form id="join-form" autocomplete="off">
        <div class="row">
          <input id="game-code" name="game-code" type="tel" inputmode="numeric" maxlength="7" placeholder="Game ID" aria-label="Enter Game ID" autofocus>
          <button type="submit" aria-label="Submit">➜</button>
        </div>
        <div class="notice" id="notice" role="status" aria-live="polite"></div>
      </form>
      <p class="hint">Enter a game code to continue</p>
    </section>
  </main>
  <script>
    document.getElementById('join-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const code = document.getElementById('game-code').value.trim();
      if (code === '5234') {
        // Open a blank tab directly from the submit gesture so popup blockers are less likely to block it.
        const blank = window.open('about:blank', '_blank');
        if (blank) {
          blank.document.title = '';
          blank.document.body.innerHTML = '';
        } else {
          document.getElementById('notice').textContent = 'Your browser blocked the new tab. Allow pop-ups and try again.';
        }
        return;
      }
      document.getElementById('notice').textContent = 'This demo page only handles the special code 5234.';
    });
  </script>
</body>
</html>
