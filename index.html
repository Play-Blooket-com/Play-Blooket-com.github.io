<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blooket</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}.top{height:31px;background:#8c00b5;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-weight:900;font-size:17px}.top .center{position:absolute;left:50%;transform:translateX(-50%);font-size:15px}.top .right{font-size:12px}.scene{height:calc(100vh - 31px);position:relative;background:#e0c900;overflow:hidden;background-image:repeating-linear-gradient(15deg,transparent 0 42px,#e8d51a 43px 46px,transparent 47px 83px),repeating-linear-gradient(105deg,transparent 0 42px,#e8d51a 43px 46px,transparent 47px 83px),radial-gradient(circle at 50% 50%,transparent 0 24px,#e6d218 25px 44px,transparent 45px);background-size:83px 83px,83px 83px,105px 105px;background-position:0 0,0 0,0 0}.leaf{position:absolute;width:var(--w);left:var(--x);top:var(--y);transform:rotate(var(--r));pointer-events:none;animation:leafDrift var(--dur,12s) linear var(--delay,0s) infinite;will-change:translate,rotate}@keyframes leafDrift{0%{translate:0 -15vh;rotate:0deg}25%{translate:35px 25vh;rotate:90deg}50%{translate:-25px 55vh;rotate:180deg}75%{translate:25px 85vh;rotate:270deg}100%{translate:-10px 115vh;rotate:360deg}}.leaf:nth-of-type(2n){--dur:15s;--delay:-7s}.leaf:nth-of-type(3n){--dur:19s;--delay:-11s}.leaf:nth-of-type(4n){--dur:13s;--delay:-4s}.leaf:nth-of-type(5n){--dur:17s;--delay:-9s}.centerbox{position:absolute;left:50%;top:36%;transform:translate(-50%,-5%);text-align:center}.title{font-size:38px;font-weight:1000;color:white;margin:0 0 12px;text-shadow:0 1px 1px #ddd}.form{display:flex;gap:4px}.input{width:122px;height:35px;border:0;border-radius:4px;background:#fff;text-align:center;font-size:16px;font-weight:bold;outline:none}.go{width:34px;height:35px;border:0;border-radius:4px;background:white;color:#555;font-size:23px;font-weight:900;cursor:pointer}.go:active{transform:translateY(1px)}@media(max-width:600px){.title{font-size:34px}.top{font-size:14px}}
